<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Resunova partners with university career centers, including UMBC — University of Maryland, Baltimore County. Unlimited scans and Career Center-aligned feedback for students, with more campuses joining.">
  <defs>
    <linearGradient id="upb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1530"/>
      <stop offset="0.5" stop-color="#14306b"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="upb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdb515"/>
      <stop offset="1" stop-color="#e5a000"/>
    </linearGradient>
    <clipPath id="upb-clip"><rect x="0" y="0" width="1200" height="360" rx="24"/></clipPath>
    <style>text { font-family: 'DM Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif; }</style>
  </defs>

  <g clip-path="url(#upb-clip)">
    <rect x="0" y="0" width="1200" height="360" fill="url(#upb-bg)"/>
    <circle cx="1090" cy="40" r="240" fill="#ffffff" opacity="0.045"/>
    <circle cx="1180" cy="330" r="180" fill="#fdb515" opacity="0.06"/>
    <circle cx="120" cy="335" r="170" fill="#2563eb" opacity="0.16"/>

    <text x="64" y="84" font-size="17" font-weight="700" letter-spacing="3" fill="#fdb515">UNIVERSITY PARTNERSHIPS</text>
    <text x="61" y="150" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#ffffff">Built with university</text>
    <text x="61" y="202" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#ffffff">career centers</text>
    <text x="64" y="246" font-size="18.5" font-weight="400" fill="#c4d2ec">Unlimited scans and Career Center-aligned feedback for</text>
    <text x="64" y="272" font-size="18.5" font-weight="400" fill="#c4d2ec">students — with more campuses joining.</text>

    <rect x="64" y="298" width="226" height="46" rx="23" fill="url(#upb-gold)"/>
    <text x="177" y="327" text-anchor="middle" font-size="17" font-weight="700" fill="#0a1530">Partner with us  →</text>

    <rect x="788" y="74" width="348" height="212" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#fdb515" stroke-opacity="0.45" stroke-width="1.5"/>

    <rect x="820" y="100" width="56" height="56" rx="14" fill="url(#upb-gold)"/>
    <g transform="translate(848 128)" stroke="#0a1530" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-16 -3 L0 -11 L16 -3 L0 5 Z" fill="#0a1530"/>
      <path d="M-9.5 0.5 V8 C-9.5 11.5 9.5 11.5 9.5 8 V0.5"/>
      <path d="M16 -3 V7"/>
    </g>

    <text x="892" y="139" font-size="31" font-weight="800" letter-spacing="1" fill="#fdb515">UMBC</text>

    <text x="820" y="198" font-size="16" font-weight="600" fill="#ffffff">University of Maryland,</text>
    <text x="820" y="220" font-size="16" font-weight="600" fill="#ffffff">Baltimore County</text>
    <text x="820" y="256" font-size="14" font-weight="500" fill="#fdb515">+ more campuses joining</text>
  </g>
</svg>
