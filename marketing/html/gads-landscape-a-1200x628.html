<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 1200px; height: 628px; }
  .stage { width: 1200px; height: 628px; display: flex; align-items: center; padding: 0 70px; }
  .left { position: relative; z-index: 1; flex: 1.15; }
  .right { position: relative; z-index: 1; flex: 1; display: flex; justify-content: flex-end; }
  h1 { font-size: 58px; font-weight: 800; letter-spacing: -2.2px; line-height: 1.05; margin: 26px 0 18px; }
  .sub { font-size: 22px; color: var(--muted); line-height: 1.5; max-width: 470px; letter-spacing: -0.2px; }
  .url { margin-top: 34px; font-size: 20px; font-weight: 700; color: var(--amber-h); }
  .score-card { width: 440px; padding: 30px 34px; }
  .score-top { display: flex; align-items: center; gap: 24px; margin-bottom: 18px; }
  .ring { position: relative; width: 120px; height: 120px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .num b { font-size: 40px; font-weight: 800; letter-spacing: -1.2px; }
  .ring .num span { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 1px; }
  .st { font-size: 21px; font-weight: 700; letter-spacing: -0.4px; }
  .ss { font-size: 15px; color: var(--muted); margin-top: 6px; line-height: 1.45; }
  .dim { display: flex; align-items: center; gap: 14px; margin-top: 13px; }
  .dim .name { width: 140px; font-size: 15px; color: var(--muted); font-weight: 500; }
  .dim .bar-track { flex: 1; height: 9px; }
  .dim .val { width: 34px; text-align: right; font-size: 15px; font-weight: 700; }
</style></head>
<body>
<div class="stage">
  <div class="left">
    <div class="logo-row" style="gap:13px;">
      <svg width="44" height="44" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="7" fill="#c4793a"/>
        <path d="M8.7 8.2v12.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M8.7 8.2h4.1a4.1 4.1 0 0 1 0 8.2H8.7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M13.2 16.4l4.4 4.4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M21.4 4.6c.35 1.75 1.25 2.65 3 3-1.75.35-2.65 1.25-3 3-.35-1.75-1.25-2.65-3-3 1.75-.35 2.65-1.25 3-3z" fill="#fff" opacity="0.88"/>
      </svg>
      <span class="wordmark" style="font-size:29px;">Resunova</span>
    </div>
    <h1>Is your résumé<br><span style="color:var(--blue);">actually good?</span></h1>
    <p class="sub">Free AI scoring in 60 seconds — <b style="color:var(--ink);">honest, validated feedback</b> across 8 dimensions.</p>
    <div class="url">resunova.io</div>
  </div>
  <div class="right">
    <div class="card score-card">
      <div class="score-top">
        <div class="ring">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="51" stroke="rgba(255,255,255,0.09)" stroke-width="11" fill="none"/>
            <circle cx="60" cy="60" r="51" stroke="url(#g)" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="320.4" stroke-dashoffset="51.3"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#34d399"/>
            </linearGradient></defs>
          </svg>
          <div class="num"><b>84</b><span>OVERALL</span></div>
        </div>
        <div>
          <div class="st">Resume Analysis</div>
          <div class="ss">Bullet-by-bullet rewrites included</div>
        </div>
      </div>
      <div class="dim"><span class="name">ATS Safety</span><div class="bar-track"><div class="bar-fill" style="width:91%;background:#34d399;"></div></div><span class="val" style="color:#34d399;">91</span></div>
      <div class="dim"><span class="name">Achievement</span><div class="bar-track"><div class="bar-fill" style="width:82%;background:#58a6ff;"></div></div><span class="val" style="color:#58a6ff;">82</span></div>
      <div class="dim"><span class="name">Quantification</span><div class="bar-track"><div class="bar-fill" style="width:71%;background:#fbbf24;"></div></div><span class="val" style="color:#fbbf24;">71</span></div>
    </div>
  </div>
</div>
</body></html>
