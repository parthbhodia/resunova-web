<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 512px; height: 512px; }
  .stage { width: 512px; height: 512px; display: flex; align-items: center; justify-content: center; }
  .stage::before { background-size: 34px 34px; }
  .mark-wrap { position: relative; z-index: 1; filter: drop-shadow(0 24px 60px rgba(196,121,58,0.45)); }

<body>
<div class="stage">
  <div class="mark-wrap">
    <svg width="300" height="300" viewBox="0 0 28 28" fill="none">

      <path d="M8 7h5A4.5 4.5 0 0 1 13 16H8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M13 16l6 5" stroke="white" stroke-width="2" stroke-linecap="round"/>

        <stop offset="0%" stop-color="#e09050"/><stop offset="100%" stop-color="#c4793a"/>
      </linearGradient></defs>
    </svg>
  </div>
</div>
</body></html>
