<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 1200px; height: 630px; }
  .stage { width: 1200px; height: 630px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 90px; }
  .inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 62px; font-weight: 800; letter-spacing: -2.2px; line-height: 1.08; margin: 30px 0 20px; }
  .sub { font-size: 24px; color: var(--muted); line-height: 1.55; max-width: 820px; letter-spacing: -0.2px; }
  .chips { display: flex; gap: 12px; margin-top: 34px; }
  .chips .chip { padding: 11px 20px; font-size: 16px; color: var(--ink); }
  .url { margin-top: 30px; font-size: 19px; font-weight: 700; color: var(--amber-h); letter-spacing: 0.3px; }
</style></head>
<body>
<div class="stage">
  <div class="inner">
    <div class="logo-row" style="gap:16px;">
      <svg width="60" height="60" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="7" fill="#c4793a"/>
        <path d="M8 7v14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M8 7h5A4.5 4.5 0 0 1 13 16H8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M13 16l6 5" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="wordmark" style="font-size:40px;">Resunova</span>
    </div>
    <h1>Score it. Fix it. Tailor it.<br><span style="color:var(--blue);">Get the callback.</span></h1>
    <p class="sub">Free AI résumé scoring with honest, validated feedback — plus 160k+ live jobs ranked against your résumé.</p>
    <div class="chips">
      <span class="chip">8-dimension score</span>
      <span class="chip">Bullet rewrites</span>
      <span class="chip">ATS-safe</span>
      <span class="chip">Tailored PDF</span>
      <span class="chip" style="color:var(--green);border-color:rgba(52,211,153,0.35);">100% free</span>
    </div>
    <div class="url">resunova.io</div>
  </div>
</div>
</body></html>
