name: Staging build

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (staging env)
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_ASSET_PREFIX: https://staging.resunova.io
          NEXT_PUBLIC_API_URL: ${{ secrets.RAILWAY_STAGING_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit
