name: Deploy staging to GitHub Pages

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (staging)
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          # Use github.io until staging.resunova.io DNS CNAME exists at Namecheap.
          # After DNS propagates, switch to: https://staging.resunova.io
          NEXT_PUBLIC_ASSET_PREFIX: https://staging.resunova.io
          NEXT_PUBLIC_API_URL: ${{ secrets.RAILWAY_STAGING_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to resunova-web-staging
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.STAGING_DEPLOY_PAT }}
          external_repository: parthbhodia/resunova-web-staging
          publish_branch: gh-pages
          publish_dir: ./out
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
