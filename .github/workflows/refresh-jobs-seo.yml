name: Refresh public jobs snapshot

# The ~1,000 public /jobs/* pages are generated from lib/jobsSeoData.generated.json.
# Nothing refreshed that file on a schedule: it only changed when a human pushed
# code, so its contents dated from whenever the last unrelated commit happened to
# land. This is the cadence — it re-fetches the snapshot daily and commits it when
# it changed, which lands on main and triggers the normal Pages deploy.
#
# Committing (rather than only regenerating inside the deploy build) is the point:
# it puts every appearance and disappearance of a job page in git history, so a
# thousand indexed URLs cannot silently rotate out with nobody able to see when or
# why. The build script refuses to publish a catastrophically smaller set on its
# own (scripts/jobsSnapshotPolicy.mjs), so a stalled upstream leaves the committed
# pages in place and says so in the log instead of retiring them.
#
# IT COMMITS TO A BRANCH AND STOPS THERE. Two earlier shapes both failed on
# repository settings rather than on anything in the script, so the constraints
# are written down here instead of being rediscovered a third time:
#
#   1. Pushing straight to main dies on GH006 ("Changes must be made through a
#      pull request") — main is protected.
#   2. Opening the PR from here dies on "GitHub Actions is not permitted to
#      create or approve pull requests" — that is a repository/org toggle
#      (Settings > Actions > General > Workflow permissions), and granting
#      `pull-requests: write` in this file does NOT satisfy it.
#
# So the snapshot accumulates as ordinary commits on a long-lived branch, and
# THE BRANCH IS THE LEDGER: `git log automation/jobs-snapshot --
# lib/jobsSeoData.generated.json` is the record of every appearance and
# disappearance of a public job page, which was the whole reason for committing
# rather than only regenerating inside the deploy. Commits accumulate on purpose
# — a force-push would keep the diff tidy and throw the ledger away.
#
# Promoting a snapshot to main is a PR a person opens from that branch, whenever
# they want one. Nothing about the public pages waits on that: deploy.yml runs
# build:seo-data at build time and publishes whatever the endpoint returns then,
# with the same guard applied.
#
# Runs an hour after resunova-api's jobs-discovery.yml (08:30 UTC), so it reads a
# corpus that was refreshed the same morning.

on:
  schedule:
    - cron: "30 9 * * *" # 09:30 UTC daily
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the set shrinks past the guard (deliberate reset)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-jobs-seo
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit goes onto another branch, and a shallow
          # clone cannot reliably push onto one it only partially has.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch the snapshot
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.RAILWAY_API_URL }}
          SEO_JOBS_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '' }}
        run: node scripts/build-jobs-seo-data.mjs

      - name: Commit it to the snapshot branch
        env:
          BRANCH: automation/jobs-snapshot
        run: |
          if git diff --quiet -- lib/jobsSeoData.generated.json; then
            echo "Snapshot unchanged — nothing to record."
            exit 0
          fi
          count=$(node -e "console.log(require('./lib/jobsSeoData.generated.json').jobs.length)")
          # Carry the freshly generated file across the branch switch by hand:
          # checking out a branch that has its own version of it would clobber
          # the fetch we just paid for.
          cp lib/jobsSeoData.generated.json "$RUNNER_TEMP/snapshot.json"
          git checkout -- lib/jobsSeoData.generated.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # DWIM off origin/$BRANCH when it exists (fetch-depth 0 gave us every
          # remote ref), otherwise start it here.
          git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH"
          cp "$RUNNER_TEMP/snapshot.json" lib/jobsSeoData.generated.json
          if git diff --quiet -- lib/jobsSeoData.generated.json; then
            echo "Snapshot matches what the branch already records — nothing to add."
            exit 0
          fi
          git add lib/jobsSeoData.generated.json
          git commit -m "Refresh public jobs snapshot (${count} jobs)"
          # No --force: the accumulated history IS the audit trail this exists for.
          git push origin "$BRANCH"
          echo "Recorded ${count} jobs on $BRANCH. Open a PR from it to publish the set to main."
