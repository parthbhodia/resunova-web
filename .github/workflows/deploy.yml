name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Gate the deploy. Without these the build was the only check standing
      # between a merge and production, so a type error or a failing test went
      # live. A failure here stops the job before the artifact is uploaded, so
      # Pages keeps serving the previous build: stale beats broken.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # A missing secret expands to an empty string, the build still succeeds,
      # and the deploy goes out green — but every route that touches the
      # Supabase client throws at the root and the user gets Next's black
      # "This page couldn't load" screen. That is a silent site-wide outage
      # produced by a passing pipeline, so assert the values exist before
      # baking them in. NEXT_PUBLIC_* are build-time constants: if they are
      # wrong here, they are wrong in production and nothing downstream can
      # recover. Values are never echoed, only their presence.
      - name: Verify build secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RAILWAY_API_URL: ${{ secrets.RAILWAY_API_URL }}
        run: |
          missing=""
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY RAILWAY_API_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Set them under Settings > Secrets and variables > Actions."
            echo "Deploying without these bakes an empty config into the bundle"
            echo "and every signed-in route renders an error screen."
            exit 1
          fi
          echo "All required build secrets are present."

      - name: Build
        env:
          # The static export is opt-in since the Vercel migration (see
          # next.config.ts). Without this the build emits a server app and
          # there is no out/ directory to upload, so Pages would deploy
          # nothing. This whole workflow retires once DNS points at Vercel.
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://www.resunova.io
          NEXT_PUBLIC_ASSET_PREFIX: https://www.resunova.io
          NEXT_PUBLIC_API_URL: ${{ secrets.RAILWAY_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:seo-data && npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
